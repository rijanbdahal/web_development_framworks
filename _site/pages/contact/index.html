    <main>
        <div id="formMessage" style="margin-top: 10px;"></div>
<form id="contactForm" name="contact" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="4" required></textarea>

    <button type="submit">Submit</button>
</form>


<script>
  document.getElementById("contactForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const formData = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      message: document.getElementById("message").value
    };
    const response = await fetch("/.netlify/functions/submitForm", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(formData)
    });

    const result = await response.json();

    // Get the form message container
    const formMessage = document.getElementById("formMessage");

    if (result.success) {
      formMessage.textContent = "Your message has been sent successfully!";
      formMessage.style.color = "green";  // Success message in green
      document.getElementById("contactForm").reset(); // Reset form after submission
    } else {
      formMessage.textContent = "There was an error submitting your form. Please try again.";
      formMessage.style.color = "red";  // Error message in red
    }
  });
</script>
